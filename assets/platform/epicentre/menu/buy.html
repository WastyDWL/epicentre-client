<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Закупка</title>
<link rel="stylesheet" href="buy.css">
</head>
<body>
<main class="buy" id="buy" hidden>
  <header class="buy-head">
    <div class="buy-title">
      <h1>Закупка</h1>
      <span class="buy-zone">В зоне закупки</span>
    </div>
    <div class="buy-money"><span class="cur">$</span><b id="money">0</b></div>
  </header>

  <section class="buy-cols" id="cols"></section>

  <aside class="buy-side">
    <img class="side-logo" id="side-logo" src="logo_tr.png" alt="">
    <div class="side-team" id="side-team">Террористы</div>
    <div class="side-money">Деньги <b id="side-money">$0</b></div>
    <div class="side-last" id="side-last"></div>
    <ul class="side-keys">
      <li><kbd>1</kbd>–<kbd>5</kbd> раздел, затем номер предмета</li>
      <li><kbd>B</kbd> или <kbd>Esc</kbd> закрыть</li>
    </ul>
  </aside>
</main>
<script src="buy.js"></script>
</body>
</html>
